services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zerna}:${POSTGRES_PASSWORD:-zerna_prod_password}@postgres:5432/${POSTGRES_DB:-zerna}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-zerna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerna_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-zerna}
      REDIS_URL: redis://:${REDIS_PASSWORD:-zerna_redis_password}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zerna_redis_password}
      REDIS_DB: 0
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: 7233
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET:-zerna-datasets-dev}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-zerna-artifacts-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      NUMBA_THREADING_LAYER: ${NUMBA_THREADING_LAYER:-workqueue}
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    networks:
      - zerna-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - zerna-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
