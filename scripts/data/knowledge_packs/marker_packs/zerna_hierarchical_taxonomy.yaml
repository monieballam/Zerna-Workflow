# ===========================================================================
# HIERARCHY SUMMARY
# ===========================================================================
# Level 1 → Level 2 → Level 3
#
# Immune → T_cells → CD4_T, CD8_T, Treg, T_exhausted, T_gd, T_memory
#       → B_cells → Naive_B, Memory_B
#       → Plasma (no L3)
#       → Myeloid → Monocyte, Classical_Mono, Non_classical_Mono,
#                   Macrophage, TAM, M1_Mac, M2_Mac, DC, cDC1, cDC2, pDC
#       → NK_cells → NK_cytotoxic
#       → Mast_cells (no L3)
#
# Stromal → CAF → myCAF, iCAF, apCAF, rCAF, Myofibroblast
#         → Pericyte (no L3)
#         → Smooth_Muscle → Vascular_SMC
#         → Osteoblast (no L3)
#         → Osteoclast (no L3)
#
# Epithelial → Luminal → Prostate_Luminal, Secretory
#            → Basal → Prostate_Basal
#            → Neuroendocrine (no L3)
#
# Endothelial → Blood_Endothelial → Tip_Cell, Stalk_Cell, Arterial, Venous
#             → Lymphatic_Endothelial (no L3)
