global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: zerna-api
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics

  - job_name: zerna-temporal-worker
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: /metrics

  - job_name: zerna-compute-plane
    static_configs:
      - targets: ['host.docker.internal:8002']
    metrics_path: /metrics
