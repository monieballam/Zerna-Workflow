[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerna-methods"
version = "0.1.0"
description = "Zerna Scientific Methods - Isolated single-cell analysis methods"
requires-python = ">=3.11"
dependencies = [
    "zerna-contracts",
    "pydantic>=2.10.0",
    "scanpy>=1.10.0",
    "anndata>=0.11.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.6.0",
    "scrublet>=0.2.3",  # Doublet detection
    "doubletdetection>=4.3.0",  # Alternative Python doublet detection
    "scvi-tools>=1.2.0",  # scVI batch correction
    "harmonypy>=0.0.10",  # Harmony batch correction
    "celltypist>=1.6.0",  # Cell type annotation
    "decoupler>=1.8.0",  # Pathway scoring
    "liana>=1.0.0",  # Ligand-receptor analysis
    "opentelemetry-api>=1.29.0",
    "leidenalg>=0.10.0",
    # PyPI has wheels only for Linux x86_64 and Windows amd64 — omit on macOS and Linux arm64.
    "tbb>=2021.13; sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "pydeseq2>=0.5.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.5.0",
    "cupy-cuda12x>=13.0.0",
]
dev = [
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[tool.uv.sources]
zerna-contracts = { workspace = true }
zerna-gpu-abstraction = { workspace = true }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'AMD64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
packages = [
    "methods",
    "methods.analysis",
    "methods.annotation",
    "methods.data",
    "methods.dimensionality_reduction",
    "methods.preprocessing",
    "methods.programs",
]

[tool.setuptools.package-dir]
methods = "."
"methods.analysis" = "analysis"
"methods.annotation" = "annotation"
"methods.data" = "data"
"methods.dimensionality_reduction" = "dimensionality_reduction"
"methods.preprocessing" = "preprocessing"
"methods.programs" = "programs"
