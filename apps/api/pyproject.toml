[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerna-api"
version = "0.1.0"
description = "Zerna Control Plane API - FastAPI application for metadata, orchestration, and API gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",  # PostgreSQL async driver
    "psycopg2-binary>=2.9.9",  # PostgreSQL sync driver for Alembic
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[argon2]>=1.7.4",  # Password hashing
    "python-multipart>=0.0.20",  # File uploads
    "boto3>=1.35.0",  # AWS S3
    "temporalio>=1.8.0",  # Temporal workflows
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",  # OTLP exporter for Jaeger/Tempo
    "opentelemetry-exporter-prometheus>=0.50b0",
    "numpy>=2.0.0",  # Scientific computing for file validation
    "pandas>=2.2.0",  # Data manipulation for CSV/TSV validation
    "scipy>=1.14.0",  # Sparse matrices for 10x MTX validation
    "anndata>=0.11.0",  # Single-cell data format for h5ad validation
    "h5py>=3.11.0",  # HDF5 file format support
    "pyyaml>=6.0.0",
    "pyarrow>=17.0.0",
    "httpx>=0.28.0",  # HTTP client for LLM backends
    "zerna-contracts",  # Shared contracts and enums
]

[project.optional-dependencies]
dev = [
    "pytest-mock>=3.14.0",
    "faker>=33.0.0",  # Test data generation
    "pytest-asyncio>=0.23.0",  # Async test support
    "fakeredis>=2.21.0",  # Fake Redis for testing
    "aiosqlite>=0.19.0",  # Async SQLite driver for testing
    "hypothesis>=6.0.0",  # Property-based testing
]

[tool.uv.sources]
zerna-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
namespaces = false
